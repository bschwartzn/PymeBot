# Construye y publica el sitio público de PymeBot.
#
# Está en dos partes a propósito:
#
#   1. CONSTRUIR  siempre corre, y deja el sitio listo como artefacto descargable. Así,
#      aunque GitHub Pages no esté disponible, cada push produce una carpeta que se puede
#      arrastrar a cualquier hosting estático (Netlify Drop, Cloudflare Pages) en segundos.
#
#   2. PUBLICAR   intenta GitHub Pages. Requiere que el repositorio sea público, o GitHub
#      Pro si se quiere mantener privado. Si no se puede, el punto 1 sigue sirviendo.
#
# El sitio se construye desde src/, no se sube ya compilado: lo publicado nunca puede
# quedar desfasado del código. Y los tests corren antes: no tiene sentido exponer un bot roto.

name: Publicar sitio

on:
  push:
    branches: [claude/pymebot-modular-plan-ev6kdh, main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/businesses/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Los links del sitio son relativos, así que no hace falta saber la dirección final.
      - run: npm run build:sitio

      # Descargable desde la pestaña Actions: sirve para cualquier hosting estático.
      - uses: actions/upload-artifact@v4
        with:
          name: sitio-pymebot
          path: dist/sitio
          retention-days: 30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    # Que Pages no esté disponible no debe teñir de rojo una construcción que salió bien.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # enablement: true activa Pages por API si el repositorio lo permite.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
