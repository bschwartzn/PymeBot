<title>__NOMBRE__</title>
<meta name="description" content="Resolvemos tus dudas al instante." />

<style>
/*__ESTILOS__*/
</style>

<main class="chat">
  <header class="cabecera">
    <div class="avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="13" rx="4" />
        <path d="M12 7V3.5" />
        <circle cx="12" cy="2.6" r="1.2" fill="currentColor" stroke="none" />
        <path d="M8.6 12.4v1.6M15.4 12.4v1.6" />
        <path d="M9.6 16.6h4.8" />
      </svg>
    </div>
    <div class="identidad">
      <h1 id="negocio">__NOMBRE__</h1>
      <p id="rubro"></p>
    </div>
  </header>

  <section class="hilo" id="hilo" aria-live="polite" aria-label="Conversación"></section>

  <div class="atajos" id="atajos"></div>

  <form class="escribir" id="escribir" autocomplete="off">
    <input
      class="campo"
      id="campo"
      type="text"
      placeholder="Escribe tu pregunta…"
      maxlength="1000"
      aria-label="Tu mensaje"
      enterkeyhint="send"
    />
    <button class="enviar" id="enviar" type="submit" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h15M13 6l6 6-6 6" />
      </svg>
    </button>
  </form>
</main>

<script>
  /* ====================================================================
     Motor de PymeBot — generado desde src/bot/ por scripts/build-chat.js.
     No editar aquí: se cambia el código fuente y se regenera.
     ==================================================================== */

  /*__ENGINE__*/

  const NEGOCIO = /*__BUSINESS__*/;

  /* ==================================================================== */

  const hiloEl = document.getElementById("hilo");
  const atajosEl = document.getElementById("atajos");
  const formEl = document.getElementById("escribir");
  const campoEl = document.getElementById("campo");
  const enviarEl = document.getElementById("enviar");

  // Sin servidor, la sesión es simplemente lo que el motor necesita recordar.
  const sesion = { greeted: false };

  /* Links tocables: en el teléfono, "agenda en https://..." tiene que abrir la agenda.
     Con nodos de texto y <a>, nunca innerHTML: lo que escriba un cliente no se ejecuta. */
  function textoConEnlaces(el, texto) {
    String(texto).split(/(https?:\/\/[^\s]+)/).forEach(function (parte, i) {
      if (i % 2 === 0) {
        if (parte) el.appendChild(document.createTextNode(parte));
        return;
      }
      var url = parte.replace(/[.,;:!?)]+$/, "");
      var enlace = document.createElement("a");
      enlace.href = url;
      enlace.target = "_blank";
      enlace.rel = "noopener";
      enlace.textContent = url.replace(/^https?:\/\//, "");
      el.appendChild(enlace);
      if (url !== parte) el.appendChild(document.createTextNode(parte.slice(url.length)));
    });
  }

  function burbuja(texto, quien) {
    const el = document.createElement("div");
    el.className = "burbuja " + quien;
    textoConEnlaces(el, texto);
    hiloEl.appendChild(el);
    hiloEl.scrollTop = hiloEl.scrollHeight;
    return el;
  }

  function escribiendo() {
    const el = document.createElement("div");
    el.className = "burbuja bot escribiendo";
    el.innerHTML = "<i></i><i></i><i></i>";
    hiloEl.appendChild(el);
    hiloEl.scrollTop = hiloEl.scrollHeight;
    return el;
  }

  function enviar(texto) {
    const mensaje = String(texto || "").trim();
    if (!mensaje) return;

    burbuja(mensaje, "cliente");
    campoEl.value = "";
    enviarEl.disabled = true;

    const pensando = escribiendo();

    // Una pausa breve para que se lea como una conversación.
    setTimeout(function () {
      const resultado = respond(mensaje, NEGOCIO, sesion);
      pensando.remove();
      burbuja(resultado.reply, "bot");
      if (resultado.intent === "saludo") sesion.greeted = true;
      enviarEl.disabled = false;
      campoEl.focus();
    }, 300);
  }

  formEl.addEventListener("submit", function (evento) {
    evento.preventDefault();
    enviar(campoEl.value);
  });

  document.getElementById("rubro").textContent = NEGOCIO.tagline || "";
  burbuja(NEGOCIO.active === false ? NEGOCIO.pausedMessage : NEGOCIO.greeting, "bot");

  if (NEGOCIO.active !== false) {
    (NEGOCIO.topics || []).forEach(function (tema) {
      const boton = document.createElement("button");
      boton.className = "atajo";
      boton.type = "button";
      boton.textContent = tema;
      boton.addEventListener("click", function () {
        enviar(tema);
      });
      atajosEl.appendChild(boton);
    });
  }
</script>
